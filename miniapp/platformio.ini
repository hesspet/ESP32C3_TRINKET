[platformio]
src_dir = src
include_dir = include

[env:esp32c3dev]
platform = espressif32
board = esp32-c3-devkitm-1
framework = arduino
lib_extra_dirs = ../lib
lib_ignore = HttpClient
upload_port = COM8
monitor_port = COM8
monitor_speed = 115200
board_build.flash_mode = qio
board_build.flash_size = 4MB
board_upload.flash_size = 4MB
board_build.partitions = huge_app.csv
lib_ldf_mode = deep+
build_flags =
  -D ARDUINO_USB_CDC_ON_BOOT=0
  -D ARDUINO_USB_MODE=0
  -D USER_SETUP_LOADED=1
  -D ST7735_DRIVER=1
  -D TFT_RGB_ORDER=TFT_BGR
  -D TFT_WIDTH=128
  -D TFT_HEIGHT=128
  -D ST7735_GREENTAB3=1
  -D TFT_INVERSION_ON=1
  -D TFT_MOSI=4
  -D TFT_SCLK=3
  -D TFT_CS=2
  -D TFT_DC=0
  -D TFT_RST=5
  -D LOAD_GLCD=1
  -D LOAD_FONT2=1
  -D LOAD_FONT4=1
  -D LOAD_FONT6=1
  -D LOAD_FONT7=1
  -D LOAD_FONT8=1
  -D LOAD_GFXFF=1
  -D SMOOTH_FONT=1
  -D SPI_FREQUENCY=27000000
  -D LV_CONF_INCLUDE_SIMPLE=1
  -I ../lib
